name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace
      - uses: actions/upload-artifact@v4
        with:
          name: B04CBridge-debug
          path: app/build/outputs/apk/debug/app-debug.apk

      # Een artifact is een zip en vereist een GitHub-login. Op de telefoon is dat gedoe,
      # dus publiceren we de APK ook als release onder een vaste tag. Dat geeft een directe
      # download zonder inloggen en zonder uitpakken:
      #   https://github.com/yannickvdheuvel/B04CBridge/releases/latest/download/B04CBridge.apk
      - name: Publiceer APK als release
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk B04CBridge.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest B04CBridge.apk \
            --title "Laatste testbuild" \
            --notes "Automatisch gebouwd uit ${{ github.sha }} (build ${{ github.run_number }})."
